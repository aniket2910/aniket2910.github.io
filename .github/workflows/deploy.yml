# Builds the static site and publishes it to GitHub Pages on every push to main,
# and nightly so the activity plates (GitHub + LeetCode) stay current.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *" # 06:00 IST

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Exposes base_path: "" for <user>.github.io, "/<repo>" for project repos.
      - id: pages
        uses: actions/configure-pages@v6

      - run: npm ci

      - run: npm run lint

      # Refreshes packages/content/src/data/activity.ts; keeps the committed
      # snapshot if GitHub or LeetCode is unreachable.
      - run: npm run activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
